[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "har-skeleton"
version = "0.1.0"
description = "Export a text-free, pseudonymized HAR performance skeleton locally."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.scripts]
har-skeleton = "har_skeleton.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/har-skeleton"
Issues = "https://github.com/KanadeK/har-skeleton/issues"

[tool.setuptools.packages.find]
include = ["har_skeleton*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
